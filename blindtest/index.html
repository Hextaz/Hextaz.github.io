<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master du Blind Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #1a1b1e; /* Discord Dark Mode approximation */
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden; /* Prevent scrolling on the main page */
        }

        /* Layout */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            height: calc(100vh - 80px); /* Subtract header height */
            gap: 1rem;
            padding: 1rem;
        }

        /* Cards */
        .card {
            background-color: #2b2d31;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            border: 1px solid #1e1f22;
        }

        /* Header Styles */
        .header-bar {
            height: 80px;
            background-color: #2b2d31;
            border-bottom: 1px solid #1e1f22;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 2rem;
        }

        /* YouTube Container specific */
        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            background: #000;
            flex-grow: 1;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        /* The Mask Overlay */
        .mask-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #111;
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s ease;
        }
        
        .mask-overlay.hidden-mask {
            opacity: 0;
            pointer-events: none;
        }

        .pulsing-icon {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.7; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Controls */
        .controls-area {
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            background: #232428;
        }

        .input-group {
            display: flex;
            gap: 0.5rem;
        }

        .input-dark {
            background: #383a40;
            border: none;
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            flex-grow: 1;
            outline: none;
        }
        
        .input-dark:focus {
            ring: 2px solid #5865F2;
        }

        .btn {
            padding: 0.5rem 1rem;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
            border: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            justify-content: center;
        }

        .btn-primary { background-color: #5865F2; color: white; }
        .btn-primary:hover { background-color: #4752C4; }

        .btn-danger { background-color: #DA373C; color: white; }
        .btn-danger:hover { background-color: #A1282C; }

        .btn-success { background-color: #23A559; color: white; }
        .btn-success:hover { background-color: #1A7F42; }

        .btn-secondary { background-color: #4e5058; color: white; }
        .btn-secondary:hover { background-color: #404249; }

        /* Buzzer Frame */
        .buzzer-frame {
            width: 100%;
            height: 100%;
            border: none;
            background: white; /* Most buzzer sites have white backgrounds */
        }
    </style>
</head>
<body>

    <!-- Header Configuration -->
    <div class="header-bar">
        <div class="flex items-center gap-4">
            <i class="fas fa-music text-2xl text-purple-400"></i>
            <h1 class="text-xl font-bold">Blind Test Master</h1>
        </div>
        
        <!-- Settings Bar -->
        <div class="flex gap-4 items-center w-2/3 justify-end">
            <div class="input-group w-1/3">
                <input type="text" id="playlistUrl" class="input-dark" placeholder="ID ou Lien Playlist YouTube">
                <button onclick="loadPlaylist()" class="btn btn-primary" title="Charger la playlist">
                    <i class="fas fa-sync-alt"></i>
                </button>
            </div>
            <div class="input-group w-1/3">
                <input type="text" id="buzzerUrl" class="input-dark" placeholder="Lien de la Room Buzzer (ex: buzzin.live)">
                <button onclick="loadBuzzer()" class="btn btn-secondary" title="Charger le site buzzer">
                    <i class="fas fa-link"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="dashboard-grid">
        
        <!-- Left: YouTube Player -->
        <div class="card relative">
            <div class="bg-gray-900 p-2 text-center text-sm font-mono text-gray-400 border-b border-gray-700 flex justify-between px-4">
                <span>LECTEUR AUDIO / VIDÉO</span>
                <span id="track-counter" class="text-yellow-400 font-bold">En attente...</span>
            </div>

            <!-- Video Area -->
            <div style="flex-grow: 1; display: flex; flex-direction: column; justify-content: center; background: black; position: relative; overflow: hidden;">
                
                <!-- The Mask -->
                <div id="videoMask" class="mask-overlay">
                    <i class="fas fa-question-circle text-9xl text-gray-600 pulsing-icon mb-4"></i>
                    <h2 class="text-3xl font-bold text-white mb-2">VIDÉO MASQUÉE</h2>
                    <p class="text-gray-400">Le son joue... Qui trouvera le titre ?</p>
                </div>

                <!-- YouTube Iframe placeholder -->
                <div id="player" class="w-full h-full absolute top-0 left-0"></div>
            </div>

            <!-- Player Controls -->
            <div class="controls-area">
                
                <div class="flex justify-between items-center mb-2">
                    <button id="toggleMaskBtn" onclick="toggleMask()" class="btn btn-success w-full text-lg py-3 shadow-lg">
                        <i class="fas fa-eye"></i> RÉVÉLER LA RÉPONSE
                    </button>
                </div>

                <div class="grid grid-cols-4 gap-2">
                    <button onclick="prevVideo()" class="btn btn-secondary"><i class="fas fa-step-backward"></i></button>
                    <button onclick="playVideo()" class="btn btn-primary"><i class="fas fa-play"></i></button>
                    <button onclick="pauseVideo()" class="btn btn-primary"><i class="fas fa-pause"></i></button>
                    <button onclick="nextVideo()" class="btn btn-secondary"><i class="fas fa-step-forward"></i></button>
                </div>
                
                <div class="flex items-center gap-2 mt-2">
                    <i class="fas fa-volume-up text-gray-400"></i>
                    <input type="range" min="0" max="100" value="100" class="w-full h-2 bg-gray-600 rounded-lg appearance-none cursor-pointer" oninput="setVolume(this.value)">
                </div>
            </div>
        </div>

        <!-- Right: Buzzer / Scoreboard -->
        <div class="card">
            <div class="bg-gray-900 p-2 text-center text-sm font-mono text-gray-400 border-b border-gray-700">
                SYSTÈME DE BUZZER & SCORES
            </div>
            <div style="flex-grow: 1; position: relative;">
                <iframe id="buzzerFrame" class="buzzer-frame" src="about:blank" allow="autoplay; microphone; camera"></iframe>
                
                <!-- Placeholder when no URL is set -->
                <div id="buzzerPlaceholder" class="absolute top-0 left-0 w-full h-full flex flex-col items-center justify-center bg-gray-800 text-gray-500">
                    <i class="fas fa-gamepad text-6xl mb-4"></i>
                    <p>Entre l'URL de ton site de buzzer en haut à droite</p>
                    <p class="text-xs mt-2">(Ex: buzzin.live, multicorner.net, massivequiz.com)</p>
                </div>
            </div>
        </div>

    </div>

    <script>
        // --- YouTube API Logic ---
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        var player;
        var isMasked = true;
        
        function onYouTubeIframeAPIReady() {
            // Initialisation vide, on attend que l'utilisateur charge une playlist
            console.log("YouTube API Ready");
        }

        function loadPlaylist() {
            const input = document.getElementById('playlistUrl').value;
            let listId = '';

            // Extract List ID from URL or use raw ID
            const urlParams = new URLSearchParams(new URL(input).search);
            if(urlParams.has('list')){
                listId = urlParams.get('list');
            } else {
                listId = input; 
            }

            if (!listId) {
                alert("ID de playlist invalide !");
                return;
            }

            // If player doesn't exist, create it
            if (!player) {
                player = new YT.Player('player', {
                    height: '100%',
                    width: '100%',
                    playerVars: {
                        'playsinline': 1,
                        'listType': 'playlist',
                        'list': listId,
                        'autoplay': 1, // Try autoplay (browser might block audio)
                        'controls': 1  // Keep controls just in case host needs them
                    },
                    events: {
                        'onReady': onPlayerReady,
                        'onStateChange': onPlayerStateChange
                    }
                });
            } else {
                // If player exists, just cue the new playlist
                player.loadPlaylist({
                    list: listId,
                    listType: 'playlist',
                    index: 0,
                    startSeconds: 0
                });
            }

            // Ensure mask is active when loading new list
            maskVideo();
        }

        function onPlayerReady(event) {
            updateTrackInfo();
            // Try to set volume to max by default
            event.target.setVolume(100);
        }

        function onPlayerStateChange(event) {
            // Update track info when video changes (State 1 = Playing, -1 = Unstarted)
            if (event.data == YT.PlayerState.PLAYING || event.data == YT.PlayerState.UNSTARTED) {
                updateTrackInfo();
            }
            
            // Optional: Auto-mask when a video ends/changes
            if (event.data == YT.PlayerState.ENDED) {
                maskVideo(); // Re-mask for the next video automatically
            }
        }

        function updateTrackInfo() {
            if (player && player.getPlaylistIndex) {
                const index = player.getPlaylistIndex() + 1;
                const total = player.getPlaylist() ? player.getPlaylist().length : '?';
                document.getElementById('track-counter').innerText = `PISTE ${index} / ${total}`;
            }
        }

        // --- Controls ---
        function playVideo() { if(player) player.playVideo(); }
        function pauseVideo() { if(player) player.pauseVideo(); }
        function nextVideo() { 
            if(player) {
                maskVideo(); // Always mask before going to next
                player.nextVideo(); 
            }
        }
        function prevVideo() { 
            if(player) {
                maskVideo();
                player.previousVideo(); 
            }
        }
        function setVolume(val) { if(player) player.setVolume(val); }

        // --- Mask Logic ---
        function toggleMask() {
            if(isMasked) {
                revealVideo();
            } else {
                maskVideo();
            }
        }

        function maskVideo() {
            const mask = document.getElementById('videoMask');
            const btn = document.getElementById('toggleMaskBtn');
            mask.classList.remove('hidden-mask');
            btn.innerHTML = '<i class="fas fa-eye"></i> RÉVÉLER LA RÉPONSE';
            btn.classList.remove('btn-danger');
            btn.classList.add('btn-success');
            isMasked = true;
        }

        function revealVideo() {
            const mask = document.getElementById('videoMask');
            const btn = document.getElementById('toggleMaskBtn');
            mask.classList.add('hidden-mask');
            btn.innerHTML = '<i class="fas fa-eye-slash"></i> MASQUER LA VIDÉO';
            btn.classList.remove('btn-success');
            btn.classList.add('btn-danger');
            isMasked = false;
        }

        // --- Buzzer Iframe Logic ---
        function loadBuzzer() {
            const url = document.getElementById('buzzerUrl').value;
            const iframe = document.getElementById('buzzerFrame');
            const placeholder = document.getElementById('buzzerPlaceholder');

            if (url) {
                let formattedUrl = url;
                if (!url.startsWith('http')) {
                    formattedUrl = 'https://' + url;
                }
                iframe.src = formattedUrl;
                placeholder.style.display = 'none';
            }
        }
    </script>
</body>
</html>
